name: SonarQube Analysis

on:
  push:
    branches:
      - main
      - master

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      # ✅ FIX 1: Full git history (removes shallow clone warning)
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # ✅ Java setup
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # ✅ Compile step
      - name: Compile Java Code
        run: |
          javac src/Main.java

      # ✅ SonarCloud Scan
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v2
        with:
          args: >
            -Dsonar.projectKey=naveenmb26_sonarqube
            -Dsonar.organization=naveenmb26
            -Dsonar.host.url=https://sonarcloud.io
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
